# Virtual workspace root: lets cargo, `just` and the git hooks run from the
# repo root. The library crates live in crates/, the lab app's shell at
# apps/lab/src-tauri and its own crates in apps/lab/crates/.
[workspace]
resolver = "2"
members = ["crates/*", "apps/lab/src-tauri", "apps/lab/crates/*"]

[workspace.dependencies]
# Game data: readers, item recipes and scene assembly. Bump all of these together,
# and to the tag the consuming app pins: `Scene` crosses the crate boundary.
sc-discovery = { git = "https://github.com/VeeLume/sc-holotable", tag = "sc-holotable/v0.42.0" }
sc-extract = { git = "https://github.com/VeeLume/sc-holotable", tag = "sc-holotable/v0.42.0" }
sc-items = { git = "https://github.com/VeeLume/sc-holotable", tag = "sc-holotable/v0.42.0" }
sc-items-visuals = { git = "https://github.com/VeeLume/sc-holotable", tag = "sc-holotable/v0.42.0" }
# The lab's Ships page only; the library takes an assembled `Scene`.
sc-vehicles = { git = "https://github.com/VeeLume/sc-holotable", tag = "sc-holotable/v0.42.0" }
sc-items-ship-components = { git = "https://github.com/VeeLume/sc-holotable", tag = "sc-holotable/v0.42.0" }
sc-weapons = { git = "https://github.com/VeeLume/sc-holotable", tag = "sc-holotable/v0.42.0" }
sc-render = { path = "crates/sc-render" }
tauri-plugin-sc-render = { path = "crates/tauri-plugin-sc-render" }
# Pinned: the rc versions of specta, specta-typescript and tauri-specta must agree.
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
specta-typescript = "0.0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Profiles must live at the workspace root — member profiles are ignored.
[profile.dev]
incremental = true

# Dependencies optimised in dev builds too: a debug DataCore parse (sc-extract,
# svarog) is tens of times slower, and the lab's catalog parses it at startup.
[profile.dev.package."*"]
opt-level = 2

# The hologram builder walks millions of vertices; timings mean nothing at -O0.
[profile.dev.package.sc-render]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
