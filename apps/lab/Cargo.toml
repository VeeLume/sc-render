# Virtual workspace root — lets cargo, `just`, and the git hooks run from the
# repo root while the app crate lives at src-tauri/. Feature and service crates
# go in crates/ and are picked up by the glob.
[workspace]
resolver = "2"
members = ["src-tauri", "crates/*"]

# Profiles must live at the workspace root — member profiles are ignored.
[profile.dev]
incremental = true

# Dependencies optimised in dev builds too: a debug DataCore parse (sc-extract,
# svarog) is tens of times slower, and the catalog parses it at startup.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
