[package]
name = "sc-render"
version = "0.1.0"
edition = "2024"
description = "Star Citizen models, materials and textures from the local install, prepared for a GPU renderer"

[dependencies]
sc-discovery = { workspace = true }
sc-extract = { workspace = true }
sc-items = { workspace = true }
sc-items-visuals = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
specta = { workspace = true, optional = true }
image_dds = { version = "0.7.2", default-features = false, features = ["ddsfile", "image"] }

[dev-dependencies]
specta-typescript = { workspace = true }

[features]
default = []
specta = ["dep:specta"]

[[example]]
name = "export_types"
required-features = ["specta"]
