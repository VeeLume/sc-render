[package]
name = "tauri-plugin-sc-render"
version = "0.1.0"
edition = "2024"
description = "Tauri plugin serving sc-render's models, materials, skeletons and textures to the webview"
links = "tauri-plugin-sc-render"

[dependencies]
sc-render = { workspace = true }
tauri = { version = "2", features = [] }
urlencoding = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
