[package]
name = "tauri-plugin-sc-render"
version = "0.5.0"
edition = "2024"
description = "Tauri plugin serving sc-render's models, materials, skeletons and textures to the webview"
links = "tauri-plugin-sc-render"

[dependencies]
sc-render = { workspace = true }
# 2.12: `with_webview` hands out the webview2-com 0.39 types used below.
tauri = { version = "2.12", features = [] }
urlencoding = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
